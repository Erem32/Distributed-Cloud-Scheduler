services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  api:
    image: distributed-cloud-scheduler:local
    build: .
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL with host db and port 5432 in .env}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).close()"
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 15s
    stop_grace_period: 10s

  worker:
    image: distributed-cloud-scheduler:local
    build: .
    profiles: ["roles", "demo"]
    command: ["python", "-m", "distributed_cloud_scheduler.worker"]
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL with host db and port 5432 in .env}
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 65s

  scheduler:
    image: distributed-cloud-scheduler:local
    build: .
    profiles: ["roles", "demo"]
    command: ["python", "-m", "distributed_cloud_scheduler.scheduler"]
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL with host db and port 5432 in .env}
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 65s

volumes:
  postgres_data:
