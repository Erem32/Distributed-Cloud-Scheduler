services:
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --project=scheduler-local
      - --host-port=0.0.0.0:8085
    ports:
      - "127.0.0.1:${PUBSUB_PORT:-8681}:8085"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/v1/projects/scheduler-local/topics', timeout=2).close()"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
